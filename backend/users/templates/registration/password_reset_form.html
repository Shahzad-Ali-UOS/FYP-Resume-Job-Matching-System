<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | CareerCoach.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] flex items-center justify-center min-h-screen p-6">
    <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-[450px] p-12 text-center">
        <h2 class="text-3xl font-black text-gray-900 mb-4">Reset Password</h2>
        <p class="text-gray-500 mb-8 font-medium">Enter your email address below to receive a reset link.</p>
        
        <form method="post" class="space-y-6 text-left">
            {% csrf_token %}
            <div>
                <label class="text-xs font-black uppercase tracking-widest text-indigo-600 ml-1">Email Address</label>
                <input type="email" name="email" required class="w-full mt-2 p-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 shadow-xl transition-all active:scale-95">
                Send Reset Link
            </button>
        </form>
        
        <a href="http://localhost:3000/login" class="inline-block mt-8 text-sm font-bold text-gray-400 hover:text-indigo-600 transition-colors uppercase tracking-widest">
            Back to Login
        </a>
    </div>
</body>
</html>
